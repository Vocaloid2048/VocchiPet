# 野生寵物生成配置文件
# Wild pet spawning configuration

# 稀有度生成權重 (總和需為 100)
# Rarity spawn weights (Sum must be 100)
rarity-rates:
  COMMON: 50
  UNCOMMON: 25
  RARE: 15
  EPIC: 7
  LEGENDARY: 2
  MYTHICAL: 1

# 生態域具體設定
# Biome specific configurations
biomes:
  PLAINS:
    COMMON:
      - id: "pet_small_bird"
        weight: 70
      - id: "pet_bunny"
        weight: 30
    UNCOMMON:
      - id: "pet_sheep_spirit"
        weight: 100
  FOREST:
    COMMON:
      - id: "pet_small_bird"
        weight: 40
      - id: "pet_fox_spirit"
        weight: 60
    RARE:
      - id: "pet_dryad"
        weight: 100
